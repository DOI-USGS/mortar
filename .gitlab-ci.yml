stages:
  - deploy

# Run pipelines for any branch or tag
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# Optional: cache R packages to speed up builds
cache:
  key: "$CI_PROJECT_ID"
  paths:
    - /usr/local/lib/R/site-library/

# Build and deploy to GitLab Pages on every branch/tag.
# GitLab Pages requires a job named "pages" that produces a "public" artifact.
pages:
  stage: deploy
  image: rocker/verse:latest
  script:
    - R -e 'install.packages(c("devtools", "pkgdown", "R.utils", "R.methodsS3", "R.oo"))'
    - R -e 'devtools::build_readme()'
    - R -e 'devtools::document()'
    - R -e 'pkgdown::build_favicons()'
    # Workaround for downlit bug: remote_metadata() calls saveRDS to
    # tempdir()/downlit/<pkg> without creating the directory. This crashes in
    # callr subprocesses. Fix: reinstall downlit from source with the bug
    # patched (add dir.create before saveRDS in remote_metadata).
    - |
      R -e '
        # Download downlit source, patch it, and reinstall
        pkg <- download.packages("downlit", destdir = tempdir(), type = "source")
        src_tar <- pkg[1, 2]
        untar(src_tar, exdir = tempdir())
        src_dir <- file.path(tempdir(), "downlit")
        
        # Find and patch the file containing remote_metadata
        r_files <- list.files(file.path(src_dir, "R"), full.names = TRUE)
        for (f in r_files) {
          content <- readLines(f)
          # Look for the saveRDS call in remote_metadata context
          idx <- grep("saveRDS\\(meta,\\s*cache_path\\)", content)
          if (length(idx) > 0) {
            # Insert dir.create before the saveRDS line
            patch_line <- "  dir.create(dirname(cache_path), recursive = TRUE, showWarnings = FALSE)"
            content <- append(content, patch_line, after = idx[1] - 1)
            writeLines(content, f)
            message("Patched ", f, " at line ", idx[1])
            break
          }
        }
        
        # Reinstall from patched source
        install.packages(src_dir, repos = NULL, type = "source")
      '
    - R -e 'pkgdown::build_site_github_pages(dest_dir = "public", install = TRUE)'
    - echo "Deploying pkgdown site to GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
