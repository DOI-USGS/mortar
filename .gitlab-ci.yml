stages:
  - build
  - deploy

# Run pipelines for any branch or tag
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# Optional: cache R packages to speed up builds
cache:
  key: "$CI_PROJECT_ID"
  paths:
    - /usr/local/lib/R/site-library/

# Build the site on every branch and upload the result as artifacts
build_site:
  stage: build
  image: rocker/verse:latest
  script:
    - R -e 'install.packages(c("devtools", "pkgdown", "R.utils", "R.methodsS3", "R.oo"))'
    - R -e 'devtools::build_readme()'
    - R -e 'devtools::document()'
    - R -e 'pkgdown::build_favicons()'
    # Build into ./public (pkgdown supports this)
    - R -e 'pkgdown::build_site_github_pages(dest_dir = "public", install = TRUE)'

    # Print a direct link to the artifact index.html so you can click it in logs.
    # Works on GitLab.com and most self-managed GitLab instances.
    - echo "Preview your branch build:"
    - echo "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/public/index.html"

  artifacts:
    # Save the built site
    paths:
      - public
    # Keep artifacts long enough for review; adjust as needed
    expire_in: 1 week
    when: always
  rules:
    # Run on any branch or tag
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# Deploy to GitLab Pages from the default branch only
pages:
  stage: deploy
  needs:
    - job: build_site
      artifacts: true
  image: alpine:latest
  script:
    # 'pages' job just exposes the 'public' folder; no extra work needed
    - echo "Deploying GitLab Pages from default branch: $CI_DEFAULT_BRANCH"
  artifacts:
    paths:
      - public
  rules:
