stages:
  - deploy

# Run pipelines for any branch or tag
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# Optional: cache R packages to speed up builds
cache:
  key: "$CI_PROJECT_ID"
  paths:
    - /usr/local/lib/R/site-library/

# Build and deploy to GitLab Pages on every branch/tag.
# GitLab Pages requires a job named "pages" that produces a "public" artifact.
pages:
  stage: deploy
  image: rocker/verse:latest
  script:
    - R -e 'install.packages(c("devtools", "pkgdown", "R.utils", "R.methodsS3", "R.oo"))'
    - R -e 'devtools::build_readme()'
    - R -e 'devtools::document()'
    - R -e 'pkgdown::build_favicons()'
    # Workaround for downlit bug: remote_metadata() calls saveRDS to
    # tempdir()/downlit/<pkg> without creating the directory first.
    # Write a build script to ensure dir exists in the same R session.
    - |
      cat > /tmp/build_site.R << 'EOF'
      dir.create(file.path(tempdir(), "downlit"), recursive = TRUE, showWarnings = FALSE)
      message("downlit cache dir: ", file.path(tempdir(), "downlit"))
      message("exists: ", dir.exists(file.path(tempdir(), "downlit")))
      pkgdown::build_site_github_pages(dest_dir = "public", install = TRUE)
      EOF
    - Rscript /tmp/build_site.R
    - echo "Deploying pkgdown site to GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
